[tool.poetry]
name = "toker-backend"
version = "0.1.0"
description = "Backend for Toker dating app"
authors = ["Your Team <your.email@edu.ece.fr>"]
readme = "README-backend.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
django = "^4.2"
djangorestframework = "^3.14"
python-dotenv = "^1.0"
numpy = "^2.3.5"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
black = "^23.0"
flake8 = "^6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
toker-cli = "cli:main"